<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Bengali:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
    background: #F8FAFC; position: relative;
  }
  .dot-grid {
    position: absolute; inset: -120px;
    background-image: radial-gradient(#CBD5E1 2.4px, transparent 2.4px);
    background-size: 40px 40px;
  }
  .orb1 { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(79,70,229,0.14) 0%, transparent 70%); top: -150px; right: -100px; }
  .orb2 { position: absolute; width: 650px; height: 650px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, transparent 70%); bottom: -150px; left: -100px; }

  .top-pill {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    background: #FFFFFF; padding: 12px 30px; border-radius: 999px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 14px 30px -6px rgba(15,23,42,0.08), 0 0 0 1.5px rgba(15,23,42,0.06);
    z-index: 10;
  }
  .pulse-dot { width: 13px; height: 13px; border-radius: 50%; background: #4F46E5; }
  .badge-txt { font-size: 20px; font-weight: 800; color: #334155; letter-spacing: 1.5px; text-transform: uppercase; }

  .stage {
    position: absolute; top: 140px; bottom: 250px; left: 90px; right: 90px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5;
  }
  .headline {
    font-size: 56px; font-weight: 800; color: #0F172A;
    text-align: center; line-height: 1.25; margin-bottom: 38px; max-width: 92%;
  }
  .hl-mark {
    display: inline-block; background: #EEF2FF; color: #4F46E5;
    padding: 4px 20px; border-radius: 16px; border: 2px solid #C7D2FE;
    box-shadow: 0 10px 22px -5px rgba(79,70,229,0.22);
  }
  .ui-card {
    background: #FFFFFF; border-radius: 28px; padding: 32px 36px;
    box-shadow: 0 24px 48px -12px rgba(15,23,42,0.10), 0 0 0 1.5px rgba(15,23,42,0.06);
    display: flex; align-items: center; gap: 24px;
  }
  .num-circle {
    width: 64px; height: 64px; border-radius: 20px; background: #4F46E5; color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; flex-shrink: 0;
    box-shadow: 0 12px 24px -6px rgba(79,70,229,0.4);
  }
  .bottom-bar {
    position: absolute; bottom: 42px; left: 85px; right: 85px;
    display: flex; align-items: center; justify-content: center; gap: 28px; z-index: 20;
  }
  .mascot-box { position: relative; width: 125px; height: 125px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .mascot-pop {
    position: absolute; top: -24px; right: -12px; background: #0F172A; color: #FFF;
    font-size: 24px; padding: 6px 15px; border-radius: 999px; font-weight: 800;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .sub-box {
    background: rgba(15,23,42,0.95); color: #FFF; padding: 22px 40px; border-radius: 24px;
    font-size: 30px; font-weight: 700; line-height: 1.38;
    box-shadow: 0 20px 40px -12px rgba(15,23,42,0.35); max-width: 1150px; text-align: center;
  }
</style>
</head>
<body>
  <div class="dot-grid" id="grid"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="top-pill">
    <div class="pulse-dot" id="dot"></div>
    <div class="badge-txt" id="badge">MINDSET UI</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="bottom-bar">
    <!-- Cute Brown Box Mascot (No Eyes/Face) -->
    <div class="mascot-box" id="mascot">
      <div class="mascot-pop" id="sym">💡</div>
      <svg width="112" height="112" viewBox="0 0 120 120" fill="none">
        <ellipse cx="60" cy="108" rx="36" ry="7" fill="rgba(15,23,42,0.15)"/>
        <rect x="22" y="34" width="76" height="66" rx="16" fill="#D97706" stroke="#78350F" stroke-width="4"/>
        <rect x="26" y="38" width="68" height="22" rx="10" fill="#F59E0B"/>
        <rect x="52" y="30" width="16" height="26" rx="4" fill="#FEF3C7" stroke="#78350F" stroke-width="3"/>
        <line x1="36" y1="84" x2="54" y2="84" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="sub-box" id="sub">Subtitle...</div>
  </div>

<script>
  const scenes = [{"start":0,"end":0.04,"badge":"Introvert vs. Extrovert","layout":"macos_window","title":"Crowd or Solitude?","highlight":"alone","cards":["Extrovert: Thrives in groups","Introvert: Prefers quiet","Which one are you?"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"Everyone loves being in a crowd, and you love being alone?"},{"start":0.04,"end":0.07,"badge":"Embrace Yourself","layout":"macos_window","title":"Your Introvert Superpower","highlight":"superpower","cards":["Solitude is Strength","Peace is Power"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"That is not a problem. It is your superpower."},{"start":0.07,"end":0.11,"badge":"Modern Life","layout":"macos_window","title":"The Noisy World","highlight":"noisy world","cards":["Constant communication","Talk over listening"],"stat":"75%","symbol":"🗣️","accent":"#4F46E5","text":"In today's noisy world, where everyone just wants to talk,"},{"start":0.11,"end":0.14,"badge":"Societal Pressure","layout":"comparison_split","title":"Quiet is Not a Crime","highlight":"crime","cards":["Perceived: Crime","Reality: Strength"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"staying quiet feels almost like a crime."},{"start":0.14,"end":0.18,"badge":"Introvert Truth","layout":"notification_stack","title":"The Lonely Myth","highlight":"lonely","cards":["Introverts find peace","Solitude is not loneliness"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"But do you know the truth? An introvert never feels lonely."},{"start":0.18,"end":0.21,"badge":"Inner Harmony","layout":"kinetic_quote","title":"Peace Within","highlight":"peace","cards":["Self-contentment","Inner calm"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"They are at peace with themselves."},{"start":0.21,"end":0.235,"badge":"External World","layout":"floating_cards","title":"Fake Smiles","highlight":"fake smiles","cards":["Forced cheer","Inauthentic bonds"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"Compared to those thousands of fake smiles"},{"start":0.235,"end":0.265,"badge":"Social Dynamics","layout":"macos_window","title":"Superficial Hangouts","highlight":"superficial","cards":["Surface-level interactions","No true connection"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"or superficial hangouts in the outside world,"},{"start":0.265,"end":0.305,"badge":"Introvert's Heaven","layout":"bento_stat","title":"Comfort & Solitude","highlight":"solitude","cards":["Personal sanctuary","Relaxation"],"stat":"90%","symbol":"☕","accent":"#4F46E5","text":"a quiet room of your own, a cup of coffee, and a bit of solitude"},{"start":0.305,"end":0.34,"badge":"Inner Growth","layout":"comparison_split","title":"Peace Multiplied","highlight":"thousandfold","cards":["Before: Busy mind","After: Deep calm"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"multiply your inner peace a thousandfold."},{"start":0.34,"end":0.37,"badge":"Inner Strength","layout":"notification_stack","title":"Strength Within","highlight":"strength","cards":["Internal power","Self-reliance"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"Your strength is within you, not outside."},{"start":0.37,"end":0.395,"badge":"Self-Acceptance","layout":"kinetic_quote","title":"Don't Change","highlight":"change yourself","cards":["Be authentic","Embrace who you are"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"So stop trying to change yourself."},{"start":0.395,"end":0.42,"badge":"Self-Worth","layout":"macos_window","title":"You Are Wonderful","highlight":"wonderful","cards":["Unique & valuable","Perfect as you are","Love yourself"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"You are wonderful just the way you are."},{"start":0.42,"end":0.46,"badge":"Join the Conversation","layout":"macos_window","title":"Share Your Thoughts","highlight":"agrees","cards":["Share your experience","Connect with others"],"stat":"100%","symbol":"✨","accent":"#4F46E5","text":"Who agrees with this calm nature of yours? Let me know in the comments."}];
  const isVert = false;

  function spring(p) {
    const c = Math.max(0, Math.min(1, p));
    return 1 - Math.pow(2, -10 * c) * Math.cos((c * 10 - 0.75) * (2 * Math.PI) / 3);
  }

  window.seekTo = function(t) {
    document.getElementById('grid').style.transform = `translate(${(t*22)%40}px, ${(t*22)%40}px)`;

    let s = scenes[scenes.length - 1] || {};
    for (let i = 0; i < scenes.length; i++) {
      if (t >= scenes[i].start && t <= scenes[i].end) { s = scenes[i]; break; }
    }

    const dur = Math.max(0.2, (s.end || 3) - (s.start || 0));
    const p = Math.max(0, Math.min(1, (t - (s.start || 0)) / dur));
    const ease = spring(Math.min(1, p * 3.0));
    const accent = s.accent || "#4F46E5";

    // Cute Mascot Motion
    const by = Math.sin(t * 6.5) * 9;
    const rot = Math.sin(t * 3.4) * 6;
    document.getElementById('mascot').style.transform = `translateY(${by}px) rotate(${rot}deg) scale(${0.92 + 0.14*ease})`;
    document.getElementById('sym').innerText = s.symbol || "✨";
    document.getElementById('badge').innerText = s.badge || "EXPLAINER";
    document.getElementById('dot').style.background = accent;
    document.getElementById('sub').innerText = s.text || "";

    let titleHtml = s.title || "";
    if (s.highlight && titleHtml.toLowerCase().includes(s.highlight.toLowerCase())) {
      const reg = new RegExp(`(${s.highlight})`, 'gi');
      titleHtml = titleHtml.replace(reg, `<span class="hl-mark" style="color:${accent};">$1</span>`);
    }

    const cards = s.cards && s.cards.length ? s.cards : ["Point 1", "Point 2", "Point 3"];
    const layout = s.layout || "floating_cards";
    let html = `<div class="headline" style="transform:translateY(${(1-ease)*35}px) scale(${0.92+0.08*ease});">${titleHtml}</div>`;

    if (layout === "macos_window") {
      const numVal = parseInt(s.stat) || 90;
      const curW = Math.min(100, Math.round(ease * numVal));
      html += `
        <div style="width:100%; max-width:1150px; background:#FFF; border-radius:28px; box-shadow:0 30px 60px -15px rgba(15,23,42,0.14), 0 0 0 1.5px #E2E8F0; overflow:hidden; transform:translateY(${(1-ease)*50}px) scale(${0.9+0.1*ease});">
          <div style="background:#F1F5F9; padding:18px 26px; display:flex; align-items:center; gap:12px; border-bottom:1.5px solid #E2E8F0;">
            <div style="width:15px;height:15px;border-radius:50%;background:#EF4444;"></div>
            <div style="width:15px;height:15px;border-radius:50%;background:#F59E0B;"></div>
            <div style="width:15px;height:15px;border-radius:50%;background:#10B981;"></div>
            <div style="margin-left:14px; background:#FFF; padding:6px 22px; border-radius:999px; font-size:16px; font-weight:700; color:#64748B;">app://mindset-studio/${(s.badge||'ui').toLowerCase()}</div>
          </div>
          <div style="padding:40px; display:flex; flex-direction:column; gap:24px;">
            <div style="display:flex; justify-content:space-between; font-size:28px; font-weight:800; color:#0F172A;">
              <span>${cards[0]}</span><span style="color:${accent};">${curW}%</span>
            </div>
            <div style="width:100%; height:24px; background:#F1F5F9; border-radius:999px; overflow:hidden;">
              <div style="width:${curW}%; height:100%; background:linear-gradient(90deg, ${accent}, #06B6D4); border-radius:999px;"></div>
            </div>
            <div style="display:flex; flex-direction:${isVert?'column':'row'}; gap:18px;">
              ${cards.slice(1,3).map((c,i) => `<div style="flex:1; background:#F8FAFC; padding:22px; border-radius:20px; border:1.5px solid #E2E8F0; font-size:25px; font-weight:700; color:#1E293B;">⚡ ${c}</div>`).join('')}
            </div>
          </div>
        </div>`;
    } else if (layout === "bento_stat") {
      html += `
        <div style="display:grid; grid-template-columns:${isVert?'1fr':'1fr 1.3fr'}; gap:26px; width:100%; max-width:1200px; transform:scale(${0.9+0.1*ease});">
          <div class="ui-card" style="flex-direction:column; justify-content:center; background:linear-gradient(135deg, ${accent}, #3B82F6); color:#FFF; padding:42px;">
            <div style="font-size:88px; font-weight:800; line-height:1;">${s.stat || '95%'}</div>
            <div style="font-size:26px; font-weight:700; opacity:0.92; margin-top:10px;">${cards[0]}</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:20px;">
            ${cards.slice(1,3).map((c,i) => `
              <div class="ui-card" style="padding:26px 30px;">
                <div class="num-circle" style="width:52px;height:52px;font-size:22px;background:${accent};">${i+1}</div>
                <div style="font-size:26px; font-weight:700; color:#1E293B;">${c}</div>
              </div>`).join('')}
          </div>
        </div>`;
    } else if (layout === "comparison_split") {
      html += `
        <div style="display:grid; grid-template-columns:${isVert?'1fr':'1fr 1fr'}; gap:28px; width:100%; max-width:1250px; transform:translateY(${(1-ease)*45}px);">
          <div class="ui-card" style="border:2.5px solid #FECDD3; background:#FFF1F2;">
            <div class="num-circle" style="background:#E11D48;">✕</div>
            <div style="font-size:28px; font-weight:800; color:#881337;">${cards[0] || 'Old Habit'}</div>
          </div>
          <div class="ui-card" style="border:2.5px solid #A7F3D0; background:#ECFDF5;">
            <div class="num-circle" style="background:#059669;">✓</div>
            <div style="font-size:28px; font-weight:800; color:#064E3B;">${cards[1] || 'Peaceful Habit'}</div>
          </div>
        </div>`;
    } else if (layout === "notification_stack") {
      html += `<div style="display:flex; flex-direction:column; gap:20px; width:100%; max-width:950px;">`;
      cards.slice(0,3).forEach((c, idx) => {
        const ce = spring(Math.max(0, Math.min(1, (p - idx*0.12)*3.2)));
        html += `
          <div class="ui-card" style="padding:24px 32px; transform:translateX(${(1-ce)*80}px) scale(${0.9+0.1*ce});">
            <div class="num-circle" style="border-radius:999px; background:${accent};">🔔</div>
            <div style="font-size:27px; font-weight:700; color:#0F172A;">${c}</div>
          </div>`;
      });
      html += `</div>`;
    } else if (layout === "kinetic_quote") {
      html += `
        <div class="ui-card" style="max-width:1100px; padding:50px; flex-direction:column; text-align:center; transform:scale(${0.88+0.12*ease});">
          <div style="font-size:44px; font-weight:800; color:#0F172A; line-height:1.35;">"${cards[0] || s.text}"</div>
          <div style="margin-top:20px; background:${accent}; color:#FFF; padding:10px 28px; border-radius:999px; font-size:22px; font-weight:800;">${s.stat || 'KEY INSIGHT'}</div>
        </div>`;
    } else {
      // Default: Floating List Cards
      html += `<div style="display:flex; flex-direction:${isVert?'column':'row'}; gap:24px; width:100%; max-width:1450px; justify-content:center;">`;
      cards.slice(0,3).forEach((c, idx) => {
        const ce = spring(Math.max(0, Math.min(1, (p - idx*0.11)*3.2)));
        html += `
          <div class="ui-card" style="flex:1; transform:translateY(${(1-ce)*65}px) scale(${0.88+0.12*ce});">
            <div class="num-circle" style="background:${accent};">${idx+1}</div>
            <div style="font-size:27px; font-weight:700; color:#1E293B; line-height:1.35;">${c}</div>
          </div>`;
      });
      html += `</div>`;
    }
    document.getElementById('stage').innerHTML = html;
  };
  window.seekTo(0.5);
</script>
</body>
</html>
