name: Faceless Line-Art Voice Video Studio

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID for Audio and Script'
        required: true
      aspect_ratio:
        description: '16:9 or 9:16'
        required: true

permissions:
  contents: write

jobs:
  render-lineart-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python, Pillow & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-pil fonts-dejavu-core
          pip3 install pillow

      - name: Generate Faceless Line-Art Animation & Sync Audio
        run: |
          mkdir -p output
          cat << 'EOF' > render_engine.py
          import json, math, os, subprocess, sys, textwrap
          from PIL import Image, ImageDraw, ImageFont

          job_id = sys.argv[1]
          ratio = sys.argv[2]
          audio_path = f"uploads/{job_id}.mp3"
          json_path = f"uploads/{job_id}.json"
          out_path = f"output/MentalPeace_{job_id}.mp4"

          W, H = (1920, 1080) if ratio == "16:9" else (1080, 1920)
          FPS = 30

          cmd_dur = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", audio_path]
          duration = float(subprocess.check_output(cmd_dur).decode().strip())
          total_frames = int(duration * FPS)

          with open(json_path, "r", encoding="utf-8") as f:
              scenes = json.load(f)

          font_size = int(W * 0.035) if ratio == "16:9" else int(W * 0.055)
          font_main = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", font_size)

          ffmpeg_cmd = [
              "ffmpeg", "-y", "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS), "-i", "-",
              "-i", audio_path, "-c:v", "libx264", "-preset", "fast", "-crf", "18",
              "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-shortest", out_path
          ]
          proc = subprocess.Popen(ffmpeg_cmd, stdin=subprocess.PIPE)

          for frame in range(total_frames):
              t = frame / FPS
              active = scenes[-1] if scenes else {"text": "", "mood": "peace", "pose": "calm"}
              for s in scenes:
                  if float(s.get("start", 0)) <= t <= float(s.get("end", 9999)):
                      active = s
                      break

              mood = active.get("mood", "peace")
              pose = active.get("pose", "calm")
              text = active.get("text", "")

              bg_colors = {
                  "overthinking": (18, 20, 32),
                  "introvert": (15, 26, 36),
                  "peace": (14, 29, 26),
                  "energy": (25, 22, 36)
              }
              img = Image.new("RGB", (W, H), bg_colors.get(mood, (16, 22, 30)))
              draw = ImageDraw.Draw(img)

              # Floating calm stars/dots (Non-living geometric)
              for i in range(15):
                  px = int((W * ((i * 0.17 + t * 0.015) % 1.0)))
                  py = int((H * ((i * 0.23 - t * 0.02) % 1.0)))
                  draw.ellipse([px, py, px+4, py+4], fill=(70, 95, 115))

              cx, cy = W // 2, int(H * 0.43)
              breathe = int(math.sin(t * 2.5) * 6)
              head_r = int(min(W, H) * 0.055)
              head_y = cy - int(min(W, H) * 0.14) + breathe

              # Ground Line
              ground_y = cy + int(min(W, H) * 0.20)
              draw.line([cx - 220, ground_y, cx + 220, ground_y], fill=(80, 110, 130), width=4)

              # FACELESS HEAD (Pure Blank Circle - No Eyes, No Nose, No Mouth)
              draw.ellipse([cx - head_r, head_y - head_r, cx + head_r, head_y + head_r], outline=(240, 245, 255), width=6)

              # Abstract Line-Art Body & Limbs
              neck_y = head_y + head_r
              hip_y = cy + int(min(W, H) * 0.07)
              draw.line([cx, neck_y, cx, hip_y], fill=(240, 245, 255), width=6)
              draw.line([cx, hip_y, cx - 45, ground_y], fill=(240, 245, 255), width=6)
              draw.line([cx, hip_y, cx + 45, ground_y], fill=(240, 245, 255), width=6)

              sh_y = neck_y + 20
              if pose == "hands_on_head":
                  draw.line([cx, sh_y, cx - 75, head_y], fill=(240, 245, 255), width=6)
                  draw.line([cx - 75, head_y, cx - head_r, head_y - 10], fill=(240, 245, 255), width=6)
                  draw.line([cx, sh_y, cx + 75, head_y], fill=(240, 245, 255), width=6)
                  draw.line([cx + 75, head_y, cx + head_r, head_y - 10], fill=(240, 245, 255), width=6)
              elif pose == "arms_open":
                  wave = int(math.sin(t * 4) * 15)
                  draw.line([cx, sh_y, cx - 110, sh_y - 30 + wave], fill=(240, 245, 255), width=6)
                  draw.line([cx, sh_y, cx + 110, sh_y - 30 - wave], fill=(240, 245, 255), width=6)
              else:
                  draw.line([cx, sh_y, cx - 65, hip_y - 10], fill=(240, 245, 255), width=6)
                  draw.line([cx, sh_y, cx + 65, hip_y - 10], fill=(240, 245, 255), width=6)

              # Symbolic Non-Living Objects Above Head
              sym_y = head_y - head_r - 75
              if mood == "overthinking":
                  # Tangled chaotic lines above head
                  for k in range(10):
                      ox1 = cx + int(math.sin(t * 6 + k) * 75)
                      oy1 = sym_y + int(math.cos(t * 5 + k * 2) * 30)
                      ox2 = cx + int(math.sin(t * 6 + k + 2) * 75)
                      oy2 = sym_y + int(math.cos(t * 5 + (k + 2) * 2) * 30)
                      draw.line([ox1, oy1, ox2, oy2], fill=(255, 110, 110), width=4)
              elif mood == "introvert":
                  # Peaceful Solitude Shield / Bubble around character
                  rad = int(min(W, H) * 0.25) + breathe
                  draw.ellipse([cx - rad, cy - rad, cx + rad, cy + rad], outline=(100, 200, 255), width=3)
              elif mood == "energy":
                  # Battery / Light Icon above head
                  draw.rectangle([cx - 40, sym_y - 20, cx + 40, sym_y + 20], outline=(255, 220, 100), width=4)
                  fill_w = int(((math.sin(t * 2) + 1) / 2) * 70)
                  draw.rectangle([cx - 35, sym_y - 15, cx - 35 + fill_w, sym_y + 15], fill=(255, 220, 100))
              else:
                  # Mental Peace Expanding Aura Waves
                  for r_idx in range(3):
                      rad = int(((t * 35 + r_idx * 45) % 130) + head_r + 15)
                      draw.ellipse([cx - rad, head_y - rad, cx + rad, head_y + rad], outline=(100, 240, 190), width=2)

              # Subtitle Box at Bottom
              if text:
                  lines = textwrap.wrap(text, width=32 if ratio == "16:9" else 20)
                  ty = int(H * 0.76)
                  for line in lines[:3]:
                      bbox = draw.textbbox((0, 0), line, font=font_main)
                      tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
                      draw.rectangle([cx - tw//2 - 20, ty - 8, cx + tw//2 + 20, ty + th + 12], fill=(10, 14, 22))
                      draw.text((cx - tw // 2, ty), line, font=font_main, fill=(255, 255, 255))
                      ty += th + 24

              proc.stdin.write(img.tobytes())

          proc.stdin.close()
          proc.wait()
          EOF

          python3 render_engine.py "${{ github.event.inputs.job_id }}" "${{ github.event.inputs.aspect_ratio }}"

      - name: Auto-Delete Uploaded Source Files from Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git rm -f "uploads/${{ github.event.inputs.job_id }}.mp3" "uploads/${{ github.event.inputs.job_id }}.json" || true
          git commit -m "Auto-cleanup temporary voice files" || true
          git push origin main || true

      - name: Upload Video to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-${{ github.event.inputs.job_id }}
          name: "Faceless Video (${{ github.event.inputs.job_id }})"
          files: output/MentalPeace_${{ github.event.inputs.job_id }}.mp4
