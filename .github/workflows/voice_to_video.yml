name: OpenMontage HyperFrames Cloud Renderer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      aspect_ratio:
        description: '16:9 or 9:16'
        required: true

permissions:
  contents: write

jobs:
  render-openmontage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HyperFrames Chromium & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
          pip3 install playwright
          playwright install --with-deps chromium

      - name: Render OpenMontage Composition to MP4
        run: |
          mkdir -p output
          cat << 'EOF' > render_hyperframes.py
          import os, subprocess, sys
          from playwright.sync_api import sync_playwright

          job_id = sys.argv[1]
          ratio = sys.argv[2]
          audio_path = f"uploads/{job_id}.mp3"
          html_path = f"uploads/{job_id}.html"
          out_path = f"output/OpenMontage_{job_id}.mp4"

          W, H = (1920, 1080) if ratio == "16:9" else (1080, 1920)
          FPS = 30

          cmd_dur = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", audio_path]
          duration = float(subprocess.check_output(cmd_dur).decode().strip())
          total_frames = int(duration * FPS)

          ffmpeg_cmd = [
              "ffmpeg", "-y", "-f", "image2pipe", "-vcodec", "mjpeg", "-r", str(FPS), "-i", "-",
              "-i", audio_path, "-c:v", "libx264", "-preset", "fast", "-crf", "17",
              "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-shortest", out_path
          ]
          proc = subprocess.Popen(ffmpeg_cmd, stdin=subprocess.PIPE)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": W, "height": H})
              page.goto(f"file://{os.path.abspath(html_path)}", wait_until="networkidle")

              for frame in range(total_frames):
                  t = frame / FPS
                  page.evaluate(f"window.seekTo({t})")
                  proc.stdin.write(page.screenshot(type="jpeg", quality=92))

              browser.close()

          proc.stdin.close()
          proc.wait()
          EOF

          python3 render_hyperframes.py "${{ github.event.inputs.job_id }}" "${{ github.event.inputs.aspect_ratio }}"

      - name: Auto-Delete Source Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git rm -f "uploads/${{ github.event.inputs.job_id }}.mp3" "uploads/${{ github.event.inputs.job_id }}.html" || true
          git commit -m "Auto-clean OpenMontage source" || true
          git push origin main || true

      - name: Publish Rendered Video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: om-${{ github.event.inputs.job_id }}
          name: "OpenMontage Video (${{ github.event.inputs.job_id }})"
          files: output/OpenMontage_${{ github.event.inputs.job_id }}.mp4
