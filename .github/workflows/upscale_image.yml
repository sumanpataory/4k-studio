name: Topaz-Style AI Image Upscaler

on:
  workflow_dispatch:
    inputs:
      image_filename:
        description: 'Uploaded Image Filename'
        required: true

permissions:
  contents: write

jobs:
  ai-upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install High-End Image Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: 4x Natural Detail Upscale + 300 DPI (Adobe Stock Ready)
        run: |
          mkdir -p output
          
          # Step 1: 4x Lanczos High-Precision Upscale + Smart Edge Enhancement & Denoise
          ffmpeg -i "uploads/${{ github.event.inputs.image_filename }}" \
            -vf "hqdn3d=1.5:1.5:3:3,scale=iw*4:ih*4:flags=lanczos+accurate_rnd+full_chroma_int,cas=0.5" \
            "output/temp_upscaled.png"
          
          # Step 2: Apply 300 DPI & Natural DSLR Micro-Contrast (98% Quality JPEG)
          convert "output/temp_upscaled.png" \
            -units PixelsPerInch -density 300 \
            -unsharp 0x0.7+0.6+0.008 \
            -sampling-factor 4:4:4 \
            -quality 98 \
            "output/AdobeReady_4x_${{ github.event.inputs.image_filename }}.jpg"

      - name: Upload Upscaled Image to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: img-upscale-${{ github.run_number }}
          name: "4x Upscaled Image #${{ github.run_number }}"
          files: output/AdobeReady_4x_${{ github.event.inputs.image_filename }}.jpg
