name: Topaz-Style AI Image Upscaler

on:
  workflow_dispatch:
    inputs:
      image_filename:
        description: 'Uploaded Image Filename'
        required: true

permissions:
  contents: write

jobs:
  ai-upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual GPU Driver & Real-ESRGAN AI Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 imagemagick wget unzip libomp5
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip -q realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          chmod +x realesrgan-ncnn-vulkan

      - name: Run True AI Neural Upscale + Natural Blend (Adobe Stock Ready)
        run: |
          mkdir -p output
          
          # 1. Run Real-ESRGAN AI Model (Cleans noise, reconstructs sharp edges & details)
          ./realesrgan-ncnn-vulkan -i "uploads/${{ github.event.inputs.image_filename }}" -o "output/ai_clean.png" -n realesrgan-x4plus -s 4 -t 256
          
          # 2. Natural Texture Polish + 300 DPI (95% Optimal Quality so MB is not bloated)
          convert "output/ai_clean.png" \
            -units PixelsPerInch -density 300 \
            -unsharp 0x0.5+0.4+0.008 \
            -quality 95 \
            "output/TopazClean_4x_${{ github.event.inputs.image_filename }}.jpg"

      - name: Upload Clean AI Image to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: img-upscale-${{ github.run_number }}
          name: "AI Clean Image #${{ github.run_number }}"
          files: output/TopazClean_4x_${{ github.event.inputs.image_filename }}.jpg
